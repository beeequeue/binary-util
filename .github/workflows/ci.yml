name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.upm/store
          key: v1-upm-${{ hashFiles('**/upm.lock') }}
          restore-keys: |
            v1-upm-
      - run: npm i -g upm@1.5.1
      - name: Install dependencies
        run: upm install --frozen-lockfile

      - parallel:
          - name: build
            run: node --run build
          - name: lint
            run: node --run lint
          - name: formatting
            run: node --run lint:format
          - name: test
            run: node --run test
